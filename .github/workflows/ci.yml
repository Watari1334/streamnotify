name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streamnotify
          POSTGRES_PASSWORD: streamnotify
          POSTGRES_DB: streamnotify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: Run tests
        env:
          TWITCH_CLIENT_ID: dummy
          TWITCH_CLIENT_SECRET: dummy
          TWITCH_EVENTSUB_SECRET: dummy
        run: ./mvnw test